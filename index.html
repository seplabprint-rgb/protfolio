<!doctype html>
<html><head><title>SepLab Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800;125,800&amp;family=DM+Sans:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
/* Layout: ink-on-paper print-shop site. Registration marks and halftone dots are the only ornament; one spot-ink blue carries every accent. */
:root{
  --paper:#ECEEF1; --paper-2:#E1E4E9; --ink:#0E1116; --ink-soft:#4A515C; --line:#C8CDD5;
  --spot:#2338D4; --spot-ink:#FFFFFF; --danger:#B3202A;
  --display:'Archivo','Arial Black',Impact,sans-serif; --body:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1116;--paper-2:#171B22;--ink:#E9ECF1;--ink-soft:#9AA3B0;--line:#2A303A;--spot:#7C92FF;--spot-ink:#0E1116;--danger:#FF7A85;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1116;--paper-2:#171B22;--ink:#E9ECF1;--ink-soft:#9AA3B0;--line:#2A303A;--spot:#7C92FF;--spot-ink:#0E1116;--danger:#FF7A85;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;margin:0;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:60}
a{color:inherit}p{margin:0}
.wrap{max-width:1120px;margin-inline:auto}
section{padding-block:clamp(52px,8vw,100px);border-top:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 16px}
h1,h2,h3{font-family:var(--display);font-stretch:125%;font-weight:800;line-height:.95;letter-spacing:-.01em;text-wrap:balance;margin:0}
h2{font-size:clamp(32px,5.6vw,60px);text-transform:uppercase}
.lead{font-size:clamp(18px,2.2vw,22px);max-width:58ch}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--spot);color:var(--spot-ink);border:0;padding:14px 22px;font:700 15px var(--body);text-decoration:none;cursor:pointer;border-radius:2px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px}
:focus-visible{outline:2px solid var(--spot);outline-offset:3px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--paper);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;max-width:1120px;margin-inline:auto}
.logo{font-family:var(--display);font-stretch:125%;font-weight:800;text-decoration:none;font-size:20px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.logo span{color:var(--spot)}
.nav ul{display:flex;gap:22px;list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nav ul a{text-decoration:none;cursor:pointer}.nav ul a:hover{color:var(--spot)}
@media(max-width:700px){.nav ul{gap:14px}.nav ul li.opt{display:none}}

.hero{border-top:0;position:relative;padding-block:clamp(44px,8vw,92px) clamp(36px,6vw,64px)}
.hero h1{font-size:clamp(42px,10vw,128px);text-transform:uppercase}
.hero h1 em,.big em{font-style:normal;color:var(--spot)}
.hero .lead{margin-top:26px}
.hero .eyebrow{padding-right:clamp(64px,12vw,140px)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.reg{position:absolute;right:0;top:clamp(20px,5vw,56px);width:clamp(52px,9vw,110px);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:clamp(36px,6vw,64px);border-top:1.5px solid var(--ink)}
.stats div{padding:16px 16px 0 0}
.stats b{display:block;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.stats span{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.05em}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;margin-top:36px}
.cat{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--paper-2);border:1px solid var(--line);padding:0;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
.cat .cover{aspect-ratio:16/10;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.cat .body{padding:0 18px 20px}
.cat h3{font-size:28px;text-transform:uppercase}
.cat p{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:8px;letter-spacing:.05em}
.cat:hover h3{color:var(--spot)}
.cat.soon{cursor:default;opacity:.7}
.img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background-image:radial-gradient(var(--line) 1.4px,transparent 1.6px);background-size:12px 12px;color:var(--ink-soft);font-family:var(--mono);font-size:12px;letter-spacing:.05em}
.ph span{background:var(--paper-2);padding:6px 10px;border:1px dashed var(--ink-soft)}

/* project list */
.crumbs{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:22px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:28px;margin-top:36px}
.pcard{cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--ink);font:inherit;min-width:0}
.pcard .shot{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--paper-2);border:1px solid var(--line)}
.pcard .shot .alt{opacity:0;transition:opacity .25s}
.pcard:hover .shot .alt{opacity:1}
.pcard h3{font-size:21px;text-transform:uppercase;margin-top:14px}
.pcard p{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:6px;letter-spacing:.04em}
.badge{position:absolute;left:10px;top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:4px 8px;z-index:2}
.draft{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;background:var(--danger);color:#fff;padding:4px 8px;z-index:2}

/* project page */
.proj h1{font-size:clamp(34px,7vw,84px);text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1.5px solid var(--ink);margin-top:28px}
.facts div{padding:14px 14px 0 0}
.facts b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.facts span{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:20px;text-transform:uppercase}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:20px}
.swatches i{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(128,128,128,.5);display:block}
.pbody{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,5vw,64px);margin-top:36px}
@media(max-width:800px){.pbody{grid-template-columns:1fr}}
.pbody p+p{margin-top:14px}
.notes{border-left:1.5px solid var(--ink);padding-left:18px}
.notes h3{font-size:16px;text-transform:uppercase;margin-bottom:10px}
.notes p{font-size:16px;color:var(--ink-soft);white-space:pre-line}
.gal-h{margin:48px 0 16px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.gal figure{margin:0;min-width:0}
.gal .fr{background:var(--paper-2);border:1px solid var(--line);cursor:zoom-in;line-height:0}
.gal .fr img{width:100%;height:auto;display:block}
.gal figcaption{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:8px}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:56px;border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap}
.lb{position:fixed;inset:0;background:rgba(5,7,10,.94);z-index:90;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain}

/* method */
.tech{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));border-top:1.5px solid var(--ink);margin-top:36px}
.tech article{padding:22px 22px 26px 0;border-bottom:1px solid var(--line)}
.tech h3{font-size:19px;text-transform:uppercase;margin-bottom:8px}
.tech p{color:var(--ink-soft);font-size:16px;max-width:40ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px;margin-top:36px;counter-reset:s;padding:0;list-style:none}
.steps li{border-left:1.5px solid var(--ink);padding-left:16px;counter-increment:s}
.steps li::before{content:"Step " counter(s);display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--spot);margin-bottom:8px}
.steps b{display:block;font-family:var(--display);font-stretch:125%;text-transform:uppercase;font-size:19px;margin-bottom:6px}
.steps span{color:var(--ink-soft);font-size:16px}
.about{max-width:70ch}.about p+p{margin-top:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tools span{font-family:var(--mono);font-size:12px;padding:6px 10px;border:1px solid var(--ink)}
.contact{background:var(--ink);color:var(--paper);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));border-top:0}
.contact .eyebrow{color:var(--paper);opacity:.7}
.contact h2{font-size:clamp(38px,8vw,100px)}
.contact h2 em{font-style:normal;color:var(--spot)}
.contact .btn.ghost{color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--paper)}
.mail{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.mail code{font-family:var(--mono);font-size:clamp(15px,2.4vw,20px);user-select:all;word-break:break-all}
footer{padding-block:26px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.empty{padding:40px 0;color:var(--ink-soft);font-family:var(--mono);font-size:14px}

/* admin */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:70;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);border-left:1.5px solid var(--ink);z-index:80;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);font-size:15px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh b{font-family:var(--display);font-stretch:125%;text-transform:uppercase}
.tabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--ink);padding:7px 10px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.db{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.db label{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.db input,.db textarea,.db select{font:400 15px var(--body);color:var(--ink);background:var(--paper-2);border:1px solid var(--line);padding:9px 10px;border-radius:2px;width:100%;text-transform:none;letter-spacing:0}
.db textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--paper-2)}
.box h4{margin:0;font:700 14px var(--body);display:flex;justify-content:space-between;gap:8px;align-items:center}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.hint2{font-size:13px;color:var(--ink-soft)}
.thumb{width:64px;height:48px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:var(--paper)}
.imgrow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start}
.imgrow .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.danger{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;z-index:100;font-size:14px}
.modal{position:fixed;inset:0;z-index:95;background:rgba(5,7,10,.7);display:grid;place-items:center;padding:20px}
.modal form{background:var(--paper);padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;border:1.5px solid var(--ink)}
.modal input{font:400 16px var(--body);padding:10px;background:var(--paper-2);border:1px solid var(--line);color:var(--ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
(function(){
const SRC_HTML = document.documentElement.outerHTML;   // pristine copy, used by "Export site"
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,8);
const slug = s => (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid();
const hash = s => {let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)};

const PUBLISHED = JSON.parse($('#site-data').textContent);
let admin = false;
try { admin = localStorage.getItem('seplab-admin') === '1'; } catch(e){}
let D = PUBLISHED;
if (admin) { try { const d = localStorage.getItem('seplab-draft'); if (d) D = JSON.parse(d); } catch(e){} }

const KINDS = {design:'Original design', separation:'Separations', mockup:'On garment / mockup', detail:'Details and close-ups'};
let route = {name:'home'};
function parseHash(){
  const h = (location.hash||'').replace(/^#\/?/,'');
  if (h === 'admin') return {name:'home', wantAdmin:true};
  const [a,b] = h.split('/');
  if (a === 'c' && b) return {name:'cat', id:b};
  if (a === 'p' && b) return {name:'proj', id:b};
  return {name:'home'};
}
function go(r, scroll=true){
  route = r;
  try { history.replaceState(null,'', r.name==='home' ? location.pathname+location.search : '#/'+(r.name==='cat'?'c':'p')+'/'+r.id); } catch(e){}
  render(); if (scroll) window.scrollTo(0,0);
}
function jump(id){ if (route.name!=='home') go({name:'home'}, false); setTimeout(()=>{ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth'}); },30); }

/* ---------- public render ---------- */
const BLOBS = {};
const S = p => (admin && BLOBS[p]) || p;
const imgOrPh = (src, label, cls='img') => src ? `<img class="${cls}" src="${esc(S(src))}" alt="${esc(label)}" loading="lazy">` : `<div class="ph"><span>${esc(label)}</span></div>`;
const visCats = () => D.categories.filter(c => admin || c.visible);
const catProjects = id => D.projects.filter(p => p.cat === id && (admin || p.visible));
const lines = (arr, i) => arr.map((l,k) => k===i ? `<em>${esc(l)}</em>` : esc(l)).join('<br>');

function header(){
  const s = D.settings;
  return `<header class="top"><div class="nav"><button class="logo" data-go="home">${esc(s.brand)}<span> ${esc(s.brandSuffix)}</span></button>
  <ul><li><a data-jump="projects">Projects</a></li><li class="opt"><a data-jump="method">Method</a></li><li class="opt"><a data-jump="about">About</a></li><li><a data-jump="contact">Contact</a></li></ul></div></header>`;
}
function footer(){ const s=D.settings; return `<div class="wrap"><footer><span>© ${new Date().getFullYear()} ${esc(s.footer)} · ${esc(s.name)}</span><span>${esc(s.email)}</span></footer></div>`; }

function contactSec(){
  const s = D.settings;
  return `<section class="contact" id="contact"><div class="wrap"><p class="eyebrow">Get in touch</p><h2>${lines(s.contactLines, s.contactAccent)}</h2>
  <p class="lead" style="margin-top:22px">${esc(s.contactSub)}</p>
  <div class="mail"><a class="btn" href="mailto:${esc(s.email)}?subject=Separation%20inquiry">Email me</a><button class="btn ghost" data-copy type="button">Copy address</button><code id="mailtxt">${esc(s.email)}</code></div>
  <div class="mail" style="margin-top:16px">${s.instagram?`<a class="btn ghost" href="${esc(s.instagram)}" target="_blank" rel="noopener">Instagram</a>`:''}${s.linkedin?`<a class="btn ghost" href="${esc(s.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`:''}</div></div></section>`;
}

function viewHome(){
  const s = D.settings;
  const cats = visCats().map(c => {
    const ps = catProjects(c.id); const cover = c.cover || (ps.find(p=>p.images[0])?.images[0]?.src) || '';
    return `<button class="cat" data-cat="${esc(c.id)}"><div class="cover">${imgOrPh(cover,'Add a cover image')}${!c.visible?'<span class="draft">Hidden</span>':''}</div>
    <div class="body"><h3>${esc(c.name)}</h3><p>${ps.length} project${ps.length===1?'':'s'} · ${esc(c.blurb)}</p></div></button>`;
  }).join('');
  return `<div class="wrap">
  <section class="hero"><svg class="reg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="6" fill="currentColor"/><path d="M50 2v34M50 64v34M2 50h34M64 50h34"/></svg>
    <p class="eyebrow">${esc(s.heroEyebrow)}</p><h1>${lines(s.heroLines, s.heroAccent)}</h1><p class="lead" style="margin-top:24px">${esc(s.heroSub)}</p>
    <div class="cta"><a class="btn" data-jump="contact">${esc(s.cta)}</a><a class="btn ghost" data-jump="projects">See projects</a></div>
    <div class="stats">${s.stats.map(([a,b])=>`<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div></section>
  <section id="projects"><p class="eyebrow">Work</p><h2>${esc(s.projectsTitle)}</h2><p class="lead" style="margin-top:18px">${esc(s.projectsIntro)}</p>
    <div class="cats">${cats || '<p class="empty">No categories yet.</p>'}</div></section>
  <section id="method"><p class="eyebrow">Method</p><h2>${esc(s.methodTitle)}</h2><p class="lead" style="margin-top:18px">${esc(s.methodIntro)}</p>
    <div class="tech">${D.techniques.map(t=>`<article><h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p></article>`).join('')}</div>
    <h2 style="font-size:clamp(24px,4vw,40px);margin-top:72px">${esc(s.stepsTitle)}</h2>
    <ol class="steps">${D.steps.map(([a,b])=>`<li><b>${esc(a)}</b><span>${esc(b)}</span></li>`).join('')}</ol></section>
  <section id="about"><p class="eyebrow">Who I am</p><h2 style="margin-bottom:22px">${esc(s.aboutTitle)}</h2><div class="about">${s.about.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    <div class="tools">${s.tools.map(t=>`<span>${esc(t)}</span>`).join('')}</div></section></div>${contactSec()}`;
}

function viewCat(){
  const c = D.categories.find(x=>x.id===route.id); if(!c) return viewHome();
  const ps = catProjects(c.id);
  return `<div class="wrap"><section style="border-top:0"><div class="crumbs"><a data-go="home">Home</a><span>/</span><span>${esc(c.name)}</span></div>
  <h2>${esc(c.name)}</h2><p class="lead" style="margin-top:16px">${esc(c.blurb)}</p>
  <div class="plist">${ps.map(p=>{
    const a = p.images.find(i=>i.kind==='mockup') || p.images.find(i=>i.kind==='separation') || p.images[0]; const b = p.images.find(i=>i!==a);
    return `<button class="pcard" data-proj="${esc(p.id)}"><div class="shot">${imgOrPh(a?.src,'Add project images')}${b?`<img class="img alt" src="${esc(S(b.src))}" alt="" loading="lazy">`:''}
    ${p.colors?`<span class="badge">${esc(p.colors)} colors</span>`:''}${!p.visible?'<span class="draft">Hidden</span>':''}</div>
    <h3>${esc(p.title)}</h3><p>${esc(p.type)}${p.turnaround?' · '+esc(p.turnaround):''}</p></button>`;}).join('') || '<p class="empty">Projects for this category are coming soon.</p>'}</div></section></div>${contactSec()}`;
}

function viewProj(){
  const p = D.projects.find(x=>x.id===route.id); if(!p) return viewHome();
  const c = D.categories.find(x=>x.id===p.cat); const sib = c ? catProjects(c.id) : []; const i = sib.findIndex(x=>x.id===p.id);
  const prev = sib[i-1], next = sib[i+1];
  const facts = [['Type',p.type],['Colors',p.colors?p.colors+' colors':''],['Turnaround',p.turnaround],['Garment',p.garment],['Mesh',p.mesh]].filter(f=>f[1]);
  const groups = Object.keys(KINDS).map(k => [k, p.images.filter(im => im.kind===k)]).filter(g=>g[1].length);
  return `<div class="wrap"><section class="proj" style="border-top:0"><div class="crumbs"><a data-go="home">Home</a><span>/</span><a data-cat="${esc(c?.id)}">${esc(c?.name||'')}</a><span>/</span><span>${esc(p.title)}</span></div>
  <h1>${esc(p.title)}</h1>
  <div class="facts">${facts.map(([a,b])=>`<div><b>${a}</b><span>${esc(b)}</span></div>`).join('')}</div>
  ${p.palette?.length?`<div class="swatches" aria-label="Ink colors">${p.palette.map(h=>`<i style="background:${esc(h)}" title="${esc(h)}"></i>`).join('')}</div>`:''}
  <div class="pbody"><div>${(p.summary||'').split(/\n\n+/).map(t=>`<p class="lead">${esc(t)}</p>`).join('')}
  ${p.techniques?.length?`<div class="tools">${p.techniques.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}</div>
  ${p.notes?`<div class="notes"><h3>Notes on this job</h3><p>${esc(p.notes)}</p></div>`:''}</div>
  ${groups.map(([k,ims])=>`<div class="gal-h">${KINDS[k]}</div><div class="gal">${ims.map(im=>`<figure><div class="fr" data-zoom="${esc(S(im.src))}"><img src="${esc(S(im.src))}" alt="${esc(im.caption||p.title)}" loading="lazy"></div>${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:''}</figure>`).join('')}</div>`).join('')}
  ${!groups.length?'<p class="empty">Images for this project are coming soon.</p>':''}
  <div class="pnav"><span>${prev?`<a class="btn ghost sm" data-proj="${esc(prev.id)}">← ${esc(prev.title)}</a>`:''}</span><span>${next?`<a class="btn ghost sm" data-proj="${esc(next.id)}">${esc(next.title)} →</a>`:''}</span></div></section></div>${contactSec()}`;
}

function render(){
  const v = route.name==='cat' ? viewCat() : route.name==='proj' ? viewProj() : viewHome();
  $('#app').innerHTML = header() + v + footer();
  document.title = (route.name==='proj' ? (D.projects.find(x=>x.id===route.id)?.title+' · ') : route.name==='cat' ? (D.categories.find(x=>x.id===route.id)?.name+' · ') : '') + D.settings.brand+' '+D.settings.brandSuffix;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-jump],[data-cat],[data-proj],[data-zoom],[data-copy]'); if(!t) return;
  if (t.dataset.go) return go({name:'home'});
  if (t.dataset.jump) return jump(t.dataset.jump);
  if (t.dataset.cat) return go({name:'cat', id:t.dataset.cat});
  if (t.dataset.proj) return go({name:'proj', id:t.dataset.proj});
  if (t.dataset.zoom) { const d=document.createElement('div'); d.className='lb'; d.innerHTML=`<img src="${esc(t.dataset.zoom)}" alt="">`; d.onclick=()=>d.remove(); document.body.appendChild(d); return; }
  if (t.dataset.copy) { const email = D.settings.email; navigator.clipboard.writeText(email).then(()=>{t.textContent='Copied'}).catch(()=>{const r=document.createRange();r.selectNodeContents($('#mailtxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent='Select and copy'}); setTimeout(()=>t.textContent='Copy address',1800); }
});

/* ---------- analytics (public visitors only) ---------- */
function loadGA(){
  const id = PUBLISHED.settings.gaId; if (!id || admin || !/^G-[A-Z0-9]+$/.test(id)) return;
  const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id='+id; document.head.appendChild(s);
  window.dataLayer = window.dataLayer || []; window.gtag = function(){dataLayer.push(arguments)}; gtag('js', new Date()); gtag('config', id);
}

/* ---------- admin ---------- */
let tab = 'site', editing = null, renderT = null;
const toast = m => { const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); };
function save(soft){
  try { localStorage.setItem('seplab-draft', JSON.stringify(D)); } catch(e){ toast('Browser storage is full. Export the site now.'); }
  clearTimeout(renderT); renderT = setTimeout(()=>{ const y=scrollY; render(); scrollTo(0,y); }, 250);
}
function unlock(){
  const m = document.createElement('div'); m.className='modal';
  m.innerHTML = `<form><b>Admin</b><input type="password" id="pw" placeholder="Passcode" autocomplete="current-password"><button class="btn" type="submit">Unlock</button><button class="btn ghost" type="button" id="cx">Cancel</button></form>`;
  document.body.appendChild(m); m.querySelector('#pw').focus();
  m.querySelector('#cx').onclick = () => m.remove();
  m.querySelector('form').onsubmit = ev => { ev.preventDefault();
    if (hash(m.querySelector('#pw').value) === PUBLISHED.settings.adminHash) { try{localStorage.setItem('seplab-admin','1')}catch(e){}; admin = true; try{const d=localStorage.getItem('seplab-draft'); if(d) D=JSON.parse(d);}catch(e){}; m.remove(); loadBlobs().then(()=>{ render(); mountAdmin(); }); }
    else toast('Wrong passcode'); };
}
function mountAdmin(){
  if (!admin) { $('#admin').innerHTML=''; return; }
  $('#admin').innerHTML = `<button class="btn fab" id="open">Edit site</button>`;
  $('#open').onclick = openDrawer;
}
function openDrawer(){
  $('#admin').innerHTML = `<div class="drawer" role="dialog" aria-label="Site editor"><div class="dh"><b>Site editor</b><div class="bar"><button class="btn sm" id="exp">Export</button><button class="btn ghost sm" id="cl">Close</button></div></div>
  <div class="tabs">${[['site','Site'],['cats','Categories'],['projects','Projects'],['method','Method'],['data','Data']].map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div><div class="db" id="db"></div></div>`;
  $('#cl').onclick = mountAdmin; $('#exp').onclick = exportSite;
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab=b.dataset.tab; editing=null; openDrawer(); });
  paintTab();
}
const F = (label, val, key, o={}) => `<label>${label}${o.area?`<textarea data-k="${key}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>${esc(val)}</textarea>`:`<input data-k="${key}" value="${esc(val)}" ${o.type?`type="${o.type}"`:''} ${o.ph?`placeholder="${esc(o.ph)}"`:''}>`}${o.hint?`<span class="hint2" style="text-transform:none;letter-spacing:0;font-family:var(--body)">${o.hint}</span>`:''}</label>`;
const getp = (o, path) => path.split('.').reduce((a,k)=>a?.[k], o);
function setp(o, path, v){ const ks=path.split('.'); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }
function bind(root, obj, post){
  root.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => {
    const k = el.dataset.k; let v = el.value;
    const tf = el.dataset.t;
    if (tf==='lines') v = v.split('\n').map(x=>x.trim()).filter(Boolean);
    else if (tf==='csv') v = v.split(',').map(x=>x.trim()).filter(Boolean);
    else if (tf==='num') v = v===''?'':Number(v);
    else if (tf==='pairs') v = v.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(a=>a[0]);
    setp(obj, k, v); save(); post && post(k);
  }));
}
const T = (label, arr, key, tf, hint, rows) => `<label>${label}<textarea data-k="${key}" data-t="${tf}" style="min-height:${rows||80}px">${esc(tf==='pairs'?arr.map(a=>a.join(' | ')).join('\n'):arr.join(tf==='csv'?', ':'\n'))}</textarea>${hint?`<span class="hint2" style="text-transform:none;letter-spacing:0;font-family:var(--body)">${hint}</span>`:''}</label>`;

function paintTab(){
  const box = $('#db'); const s = D.settings;
  if (tab==='site') {
    box.innerHTML = `<div class="box"><h4>Brand</h4><div class="row">${F('Brand',s.brand,'settings.brand')}${F('After brand',s.brandSuffix,'settings.brandSuffix')}</div>${F('Your name',s.name,'settings.name')}${F('Email',s.email,'settings.email')}${F('Instagram link',s.instagram,'settings.instagram')}${F('LinkedIn link',s.linkedin,'settings.linkedin')}</div>
    <div class="box"><h4>First screen</h4>${F('Small line above title',s.heroEyebrow,'settings.heroEyebrow')}${T('Title (one line per row)',s.heroLines,'settings.heroLines','lines','',90)}${F('Colored line number (0 = first)',s.heroAccent,'settings.heroAccent',{type:'number'})}${F('Sub text',s.heroSub,'settings.heroSub',{area:1})}${F('Main button text',s.cta,'settings.cta')}${T('Three facts (one per row: Title | small text)',s.stats,'settings.stats','pairs','',90)}</div>
    <div class="box"><h4>Sections</h4>${F('Projects title',s.projectsTitle,'settings.projectsTitle')}${F('Projects intro',s.projectsIntro,'settings.projectsIntro',{area:1})}${F('Method title',s.methodTitle,'settings.methodTitle')}${F('Method intro',s.methodIntro,'settings.methodIntro',{area:1})}${F('Steps title',s.stepsTitle,'settings.stepsTitle')}${F('About title',s.aboutTitle,'settings.aboutTitle')}${T('About text (one paragraph per row)',s.about,'settings.about','lines','',120)}${T('Tools (comma separated)',s.tools,'settings.tools','csv')}</div>
    <div class="box"><h4>Contact</h4>${T('Title (one line per row)',s.contactLines,'settings.contactLines','lines','',70)}${F('Sub text',s.contactSub,'settings.contactSub',{area:1})}${F('Footer name',s.footer,'settings.footer')}</div>
    <div class="box"><h4>Google Analytics</h4>${F('Measurement ID',s.gaId,'settings.gaId',{ph:'G-XXXXXXXXXX',hint:'From Google Analytics 4. Counts visitors only after you export and publish. Your own visits are skipped.'})}</div>
    <div class="box"><h4>Admin passcode</h4><label>New passcode<input id="npw" type="password" autocomplete="new-password"></label><button class="btn sm" id="setpw" type="button">Change passcode</button><p class="hint2">This only hides the editor from visitors. It does not lock your files, and nobody can change what visitors see without your exported file.</p></div>`;
    bind(box, D);
    $('#setpw').onclick = () => { const v=$('#npw').value; if(v.length<6) return toast('Use at least 6 characters'); D.settings.adminHash = hash(v); save(); toast('Passcode changed. Export the site to keep it.'); };
  }
  if (tab==='cats') {
    box.innerHTML = D.categories.map((c,i)=>`<div class="box" data-i="${i}"><h4>${esc(c.name)}<span class="bar"><button class="btn ghost sm" data-a="up">↑</button><button class="btn ghost sm" data-a="dn">↓</button><button class="btn ghost sm danger" data-a="rm">Delete</button></span></h4>
      ${F('Name',c.name,`categories.${i}.name`)}${F('Short line',c.blurb,`categories.${i}.blurb`)}${F('Cover image (optional link or path)',c.cover,`categories.${i}.cover`)}
      <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-vis="${i}" ${c.visible?'checked':''} style="width:auto"> Visible to visitors</label></div>`).join('') + `<button class="btn" id="addcat">Add category</button><p class="hint2">Add DTF, DTG or anything else whenever you are ready. Keep it hidden until it has projects.</p>`;
    bind(box, D);
    box.querySelectorAll('[data-vis]').forEach(el=>el.onchange=()=>{D.categories[el.dataset.vis].visible=el.checked;save()});
    box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.closest('[data-i]').dataset.i;
      if(b.dataset.a==='rm'){ const n=D.projects.filter(p=>p.cat===D.categories[i].id).length; if(n && !b.dataset.sure){b.dataset.sure=1;b.textContent=`Delete with ${n} projects?`;return;} D.projects=D.projects.filter(p=>p.cat!==D.categories[i].id); D.categories.splice(i,1); }
      else { const j=b.dataset.a==='up'?i-1:i+1; if(j<0||j>=D.categories.length) return; [D.categories[i],D.categories[j]]=[D.categories[j],D.categories[i]]; }
      save(); paintTab(); });
    $('#addcat').onclick=()=>{ const id=uid(); D.categories.push({id:'cat-'+id,name:'New category',blurb:'',visible:false,cover:''}); save(); paintTab(); };
  }
  if (tab==='projects') {
    if (editing) return paintProject();
    box.innerHTML = D.categories.map(c=>`<div class="box"><h4>${esc(c.name)}</h4>${D.projects.filter(p=>p.cat===c.id).map(p=>`<div class="bar" style="justify-content:space-between;align-items:center"><span>${esc(p.title)}${p.visible?'':' <span class="hint2">(hidden)</span>'}</span><span class="bar"><button class="btn ghost sm" data-edit="${p.id}">Edit</button></span></div>`).join('') || '<p class="hint2">No projects yet.</p>'}<button class="btn sm" data-new="${c.id}">Add project to ${esc(c.name)}</button></div>`).join('') || '<p class="hint2">Create a category first.</p>';
    box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;paintTab()});
    box.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{const id='p-'+uid(); D.projects.push({id,cat:b.dataset.new,title:'New project',visible:false,type:'Spot color',colors:'',turnaround:'',garment:'',mesh:'',summary:'',notes:'',techniques:[],palette:[],images:[]}); save(); editing=id; paintTab();});
  }
  if (tab==='method') {
    box.innerHTML = D.techniques.map((t,i)=>`<div class="box" data-i="${i}"><h4>${esc(t.title)}<button class="btn ghost sm danger" data-rm="${i}">Delete</button></h4>${F('Title',t.title,`techniques.${i}.title`)}${F('Description',t.desc,`techniques.${i}.desc`,{area:1})}</div>`).join('')
     + `<button class="btn" id="addt">Add technique</button><div class="box"><h4>Process steps</h4>${T('One per row: Title | description',D.steps,'steps','pairs','',160)}</div>`;
    bind(box, D);
    box.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{D.techniques.splice(+b.dataset.rm,1);save();paintTab()});
    $('#addt').onclick=()=>{D.techniques.push({title:'New technique',desc:''});save();paintTab()};
  }
  if (tab==='data') {
    box.innerHTML = `<div class="box"><h4>Publish your changes</h4><p class="hint2">Edits and images are saved in this browser only. Visitors see them after you export and upload everything inside <b>seplab-site.zip</b> to your host. Always keep editing from the same browser.</p><button class="btn" id="exp2">Export site (zip)</button></div>
    <div class="box"><h4>Backup</h4><button class="btn ghost" id="bk">Download data backup (.json)</button><label>Restore from backup<input type="file" id="rs" accept="application/json"></label></div>
    <div class="box"><h4>Reset</h4><p class="hint2">Drops your unexported edits and goes back to the version in this file.</p><button class="btn ghost danger" id="rst">Discard edits</button></div>
    <div class="box"><h4>Log out</h4><button class="btn ghost" id="lo">Lock editor</button></div>`;
    $('#exp2').onclick = exportSite;
    $('#bk').onclick = () => dl('seplab-backup.json', JSON.stringify(D), 'application/json');
    $('#rs').onchange = async e => { try { const j = JSON.parse(await e.target.files[0].text()); if(!j.settings||!j.projects) throw 0; D=j; save(); render(); toast('Restored'); } catch(x){ toast('That file is not a valid backup'); } };
    $('#rst').onclick = () => { try{localStorage.removeItem('seplab-draft')}catch(e){}; D = PUBLISHED; render(); paintTab(); toast('Edits discarded'); };
    $('#lo').onclick = () => { try{localStorage.removeItem('seplab-admin')}catch(e){}; admin=false; D=PUBLISHED; $('#admin').innerHTML=''; render(); };
  }
}

  ${p.images.map((im,k)=>`<div class="imgrow" data-k2="${k}"><img class="thumb" src="${esc(S(im.src))}" alt=""><div class="f"><select data-im="kind">${Object.entries(KINDS).map(([v,n])=>`<option value="${v}" ${v===im.kind?'selected':''}>${n}</option>`).join('')}</select><input data-im="caption" value="${esc(im.caption||'')}" placeholder="Caption (e.g. Channel 3, underbase)"><div class="bar"><button class="btn ghost sm" data-im-a="up">↑</button><button class="btn ghost sm" data-im-a="dn">↓</button><button class="btn ghost sm danger" data-im-a="rm">Remove</button></div></div></div>`).join('')}
  <label>Upload images (many at once)<input type="file" id="up" accept="image/*" multiple></label>
  <div class="row"><label>Or image link / path<input id="urlin" placeholder="images/eagle-sep.jpg"></label><button class="btn ghost sm" id="addurl" style="align-self:end">Add</button></div>
  <p class="hint2">Images are saved exactly as you upload them: same size, same quality, no compression. They go into the <b>images</b> folder when you export.</p></div>
  <button class="btn ghost danger" id="delp">Delete project</button>`;
  bind(box, D);
  $('#back').onclick=()=>{editing=null;paintTab()};
  $('#view').onclick=()=>{ go({name:'proj',id:p.id}); };
  $('#pvis').onchange=e=>{p.visible=e.target.checked;save()};
  box.querySelectorAll('select[data-k]').forEach(el=>el.addEventListener('change',()=>{ setp(D,el.dataset.k,el.value); save(); }));
  box.querySelectorAll('[data-k2]').forEach(r=>{ const k=+r.dataset.k2;
    r.querySelectorAll('[data-im]').forEach(el=>el.addEventListener('input',()=>{p.images[k][el.dataset.im]=el.value;save()}));
    r.querySelectorAll('[data-im-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.imA; if(a==='rm') p.images.splice(k,1); else { const j=a==='up'?k-1:k+1; if(j<0||j>=p.images.length) return; [p.images[k],p.images[j]]=[p.images[j],p.images[k]]; } save(); paintProject();}); });
  $('#up').onchange=async e=>{ for(const f of e.target.files){ try{ p.images.push({src:await storeFile(f),kind:'separation',caption:''}); }catch(x){ toast('Could not store '+f.name); } } save(); paintProject(); };
  $('#addurl').onclick=()=>{const v=$('#urlin').value.trim(); if(!v) return; p.images.push({src:v,kind:'separation',caption:''}); save(); paintProject();};
  $('#delp').onclick=function(){ if(!this.dataset.sure){this.dataset.sure=1;this.textContent='Tap again to delete';return;} D.projects.splice(i,1); editing=null; save(); paintTab(); };
}

/* Originals are kept byte-for-byte (no resize, no recompression). They live in IndexedDB in this browser and are packed into the export zip. */
const idb = () => new Promise((res,rej)=>{ const r=indexedDB.open('seplab-images',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const idbDo = async (mode, fn) => { const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('f',mode); const out=fn(t.objectStore('f')); t.oncomplete=()=>res(out&&'result' in out?out.result:undefined); t.onerror=()=>rej(t.error); }); };
const idbPut = (k,v) => idbDo('readwrite', st=>st.put(v,k));
const idbAll = async () => { const db=await idb(); return new Promise((res,rej)=>{ const o={}; const t=db.transaction('f','readonly'); const c=t.objectStore('f').openCursor(); c.onsuccess=()=>{ const cur=c.result; if(cur){ o[cur.key]=cur.value; cur.continue(); } else res(o); }; c.onerror=()=>rej(c.error); }); };
async function loadBlobs(){ try { const all=await idbAll(); for (const k in all) BLOBS[k]=URL.createObjectURL(all[k]); } catch(e){} }
async function storeFile(f){
  const base = f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/^-+/,'') || 'image';
  let name = base, n = 1; while (BLOBS['images/'+name] && n < 500) { name = base.replace(/(\.[^.]*)?$/, '-'+(++n)+'$1'); }
  await idbPut('images/'+name, f); BLOBS['images/'+name] = URL.createObjectURL(f); return 'images/'+name;
}
function loadZip(){ return new Promise((res,rej)=>{ if (window.JSZip) return res(window.JSZip); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload=()=>res(window.JSZip); s.onerror=()=>rej(new Error('zip')); document.head.appendChild(s); }); }

function dl(name, text, type){ const b=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
async function exportSite(){
  const json = JSON.stringify(D).replace(/</g,'\\u003c');
  const html = '<!doctype html>\n' + SRC_HTML.replace(/(<script id="site-data" type="application\/json">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+json+b);
  const used = new Set(); const add = p => { if (p && /^images\//.test(p)) used.add(p); };
  D.categories.forEach(c=>add(c.cover)); D.projects.forEach(p=>p.images.forEach(i=>add(i.src)));
  let all = {}; try { all = await idbAll(); } catch(e){}
  const missing = [...used].filter(p => !all[p]);
  try {
    const Z = await loadZip(); const z = new Z(); z.file('index.html', html);
    for (const p of used) if (all[p]) z.file(p, all[p], {compression:'STORE'});
    const blob = await z.generateAsync({type:'blob'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='seplab-site.zip'; document.body.appendChild(a); a.click(); a.remove();
    toast(missing.length ? 'Exported, but '+missing.length+' image(s) were not found in this browser: '+missing.slice(0,3).join(', ')+'. Copy them into the images folder yourself.' : 'Exported seplab-site.zip. Upload everything inside it to your host.');
  } catch(e) { dl('index.html', html, 'text/html'); toast('Could not build the zip (no internet?). Saved index.html only. Copy your images folder next to it.'); }
}
